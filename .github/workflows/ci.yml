name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes, except on main,
# where a cancelled run would never save the Rust cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.11.3

jobs:
  # Linux also runs the lints: clippy compiles everything cargo check does, so a
  # separate lint job would only repeat the install and the build.
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Setup toolchain (rust, node, pnpm)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Add rustfmt and clippy
        if: matrix.platform == 'ubuntu-22.04'
        run: rustup component add rustfmt clippy

      - name: rustfmt
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all --check

      - name: clippy
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo check
        if: matrix.platform != 'ubuntu-22.04'
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets

  servers:
    # ears-stt and ears-llm link the system whisper.cpp and llama.cpp, which
    # Arch packages with pkg-config metadata.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git git-lfs base-devel clang rustup whisper-cpp llama-cpp

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup rust
        run: rustup default stable && rustup component add clippy

      - name: clippy
        run: cargo clippy -p ears-stt -p ears-llm --all-targets -- -D warnings

      - name: test
        run: cargo test -p ears-stt -p ears-llm
