name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.11.0

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Setup toolchain (rust, node, pnpm)
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all --check

      - name: clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Setup toolchain (rust, node, pnpm)
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets

  servers:
    # ears-stt and ears-llm link the system whisper.cpp and llama.cpp, which
    # Arch packages with pkg-config metadata.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git git-lfs base-devel clang rustup whisper-cpp llama-cpp

      - uses: actions/checkout@v4

      - name: Setup rust
        run: rustup default stable && rustup component add clippy

      - name: clippy
        run: cargo clippy -p ears-stt -p ears-llm --all-targets -- -D warnings

      - name: test
        run: cargo test -p ears-stt -p ears-llm
