name: release

# release-please publishes the release, with its notes; this builds the
# assets and uploads them to it.
on:
  release:
    types: [published]

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.11.3

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M-series)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Setup toolchain (rust, node, pnpm)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Add macOS cross-targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Upload to the release that triggered this run. Without the id, v1
          # rewrites the release's name and body, wiping release-please's notes.
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  servers:
    # ears-stt and ears-llm link Arch's whisper.cpp and llama.cpp, so they are
    # built on Arch. built-with.txt records the versions the AUR -bin
    # packages pin.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git git-lfs base-devel clang rustup github-cli whisper-cpp llama-cpp

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup rust
        run: rustup default stable

      - name: Build
        run: cargo build --release --locked -p ears-stt -p ears-llm

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pacman -Q whisper-cpp llama-cpp ggml > built-with.txt
          for name in stt llm; do
            dir="ears-$name-$version-x86_64"
            mkdir "$dir"
            cp "target/release/ears-$name" "$name/systemd/ears-$name.service" \
              "$name/env.example" "$name/README.md" LICENSE built-with.txt "$dir/"
            if [ "$name" = llm ]; then cp llm/models.toml "$dir/"; fi
            tar -czf "$dir.tar.gz" "$dir"
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ears-*-x86_64.tar.gz built-with.txt --repo "$GITHUB_REPOSITORY" --clobber

