[package]
name = "ears"
version = "0.2.1"
edition = "2021"

[lib]
name = "ears_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

cpal = { version = "0.18.2", features = ["pulseaudio"] }
reqwest = { version = "0.13", features = ["multipart", "json"] }
rubato = { version = "3.0", features = ["fft_resampler"] }
anyhow = "1"
enigo = "0.6"
image = "0.25.10"
ocrs = "0.12.2"
rten = "0.27.0"
tokio-tungstenite = "0.30"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", features = ["wayland", "x11rb"] }
# Screen capture through the desktop's screenshot portal (works on Wayland).
# async-io, not the default tokio: tokio mode would leak into the zbus that
# the notification plugin uses blocking, and panic inside the runtime.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.6"
