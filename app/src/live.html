<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ears - live</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #252525;
      --border: #333;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #4a9eff;
      --danger: #ff5555;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: default;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }
    #panel {
      width: 100%;
      max-height: 190px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #wave {
      width: 46px;
      height: 24px;
      flex-shrink: 0;
    }
    .spacer { flex: 1; }
    #stop {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    #mic {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #mic:hover, #mic.open { background: var(--surface); color: var(--text); }
    #mic svg { width: 14px; height: 14px; }
    #mics {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #mics[hidden] { display: none; }
    #mics button {
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13px;
      padding: 5px 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #mics button:hover { background: var(--surface); color: var(--text); }
    #mics button.current { color: var(--accent); }
    #stop:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    #stop .sq { width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
    #text {
      font-size: 14px;
      line-height: 1.5;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #text::-webkit-scrollbar { display: none; }
    .committed { color: var(--text); }
    .partial { color: var(--text-dim); }
    #text:empty, #mics:not([hidden]) + #text { display: none; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="bar">
      <canvas id="wave"></canvas>
      <span class="spacer"></span>
      <button id="mic" title="Microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button>
      <button id="stop"><span class="sq"></span>Stop</button>
    </div>
    <div id="mics" hidden></div>
    <div id="text"></div>
  </div>
  <script src="live.js"></script>
</body>
</html>
