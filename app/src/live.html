<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ears - live</title>
  <style>
    :root {
      --bg: #ffffff; --raised: #ecece8; --line: #dcdcd6; --line2: #8e9197;
      --text: #1b1c1f; --dim: #4f5359; --faint: #666a71;
      --accent: #3554d1; --accent-soft: rgba(53, 84, 209, .10); --rec: #d63a2c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181b; --raised: #292b31; --line: #383b43; --line2: #4d515a;
        --text: #ecedef; --dim: #b3b7be; --faint: #969ba3;
        --accent: #8aa4ff; --accent-soft: rgba(138, 164, 255, .14); --rec: #ff6f61;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden; cursor: default;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; color: var(--text);
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    #root {
      width: 100%; height: 100%; padding: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px;
    }
    .cap {
      max-width: 640px; max-height: 64px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: var(--bg); border-radius: 10px; padding: 6px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    }
    .cap p { font-size: 17px; line-height: 26px; font-weight: 500; text-align: center; }
    .cap .pt { color: var(--faint); }
    .strip {
      width: 100%; height: 44px; flex: none; border-radius: 10px; background: var(--bg);
      border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      display: flex; align-items: center; gap: 12px; padding: 0 6px 0 12px;
    }
    .mark { flex: none; color: var(--text); }
    .mark circle { fill: var(--rec); transition: fill .2s; }
    .busy .mark circle { fill: var(--line2); }
    .hist { flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; }
    .hist span { width: 3px; height: 3px; border-radius: 2px; background: var(--accent); transition: height .3s ease-out; flex: none; }
    .busy .hist span { background: var(--line2); }
    .tm { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; color: var(--dim); }
    .ic { width: 32px; height: 32px; border-radius: 6px; border: 0; background: transparent; color: var(--dim); display: flex; align-items: center; justify-content: center; flex: none; }
    .ic:hover, .ic.open { background: var(--raised); color: var(--text); }
    .stop { width: 32px; height: 32px; border-radius: 6px; border: 0; background: var(--rec); display: flex; align-items: center; justify-content: center; flex: none; }
    .stop i { width: 10px; height: 10px; border-radius: 2px; background: #fff; }
    .stop:hover { filter: brightness(1.08); }
    .stop:disabled { background: var(--raised); cursor: default; filter: none; }
    .stop:disabled i { background: var(--faint); }
    .pop {
      width: 100%; padding: 6px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
      max-height: 120px; overflow-y: auto; scrollbar-width: none;
    }
    .pop button { height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); font-size: 12.5px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pop button:hover { background: var(--raised); color: var(--text); }
    .pop button.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="root">
    <div id="cap" class="cap" hidden><p><span id="cap-c"></span><span id="cap-p" class="pt"></span></p></div>
    <div id="pop" class="pop" hidden></div>
    <div id="strip" class="strip">
      <svg class="mark" width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"><path d="M20 14A22 22 0 0 0 20 50"/><path d="M44 14A22 22 0 0 1 44 50"/></g><circle cx="32" cy="32" r="10.5"/></svg>
      <div id="hist" class="hist" aria-hidden="true"></div>
      <span id="tm" class="tm">0:00</span>
      <button id="mic" class="ic" aria-label="Microphone" aria-expanded="false" title="Microphone">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
      </button>
      <button id="stop" class="stop" aria-label="Stop" title="Stop"><i></i></button>
    </div>
  </div>
  <script src="live.js"></script>
</body>
</html>
