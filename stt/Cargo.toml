[package]
name = "ears-stt"
version = "0.2.1"
edition = "2021"
description = "OpenAI-compatible speech-to-text server for ears, backed by whisper.cpp"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.30"
