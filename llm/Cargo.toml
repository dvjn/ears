[package]
name = "ears-llm"
version = "0.3.0"
edition = "2021"
description = "OpenAI-compatible chat server for ears transcript clean-up, backed by llama.cpp"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"

[features]
# GPU acceleration through Vulkan (NVIDIA, AMD, Intel); see vendor/ggml.rs.
default = ["vulkan"]
vulkan = []
