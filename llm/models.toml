# ears-llm model catalog. Every model here fits in under 3 GB of VRAM at the
# default 4k context (measured on an RTX 3060 Ti, including CUDA overhead).
# Files come from Hugging Face on first use (an existing copy in
# ~/.cache/huggingface is reused). Only one model is loaded at a time.
#
# Override by copying this file to ~/.config/ears-llm/models.toml.

# Loaded at startup; used when a request names no model.
default = "granite-4.2-3b"

[defaults]
context = 4096
max_tokens = 1024

# Default: follows the prompt closely, resolves self-corrections, and doesn't
# copy screen context into its reply.
[models."granite-4.2-3b"]
repo = "ibm-granite/granite-4.2-3b-GGUF"
file = "granite-4.2-3b-Q4_K_M.gguf"
description = "Default, best clean-up quality. ~2.7 GB VRAM."

# Qwen3.5 is a reasoning model; an empty think block makes it answer directly.
[models."qwen3.5-2b"]
repo = "unsloth/Qwen3.5-2B-GGUF"
file = "Qwen3.5-2B-Q4_K_M.gguf"
assistant_prefix = "<think>\n\n</think>\n\n"
description = "Fast and small; can repeat screen context. ~1.9 GB VRAM."

[models."qwen3.5-0.8b"]
repo = "unsloth/Qwen3.5-0.8B-GGUF"
file = "Qwen3.5-0.8B-Q4_K_M.gguf"
assistant_prefix = "<think>\n\n</think>\n\n"
description = "Smallest, light tidying only. ~1.2 GB VRAM."

# Fine-tuned only for dictation cleanup: ignores custom prompts and screen
# context, and must get the prompt it was trained on.
[models."speakoflow-mini"]
repo = "SpeakoFlow/speakoflow-mini"
file = "SpeakoFlow-Mini-0.8B-Q8_0.gguf"
kind = "cleanup"
system_prompt = "You clean up SpeakoFlow dictation. Return only the cleaned transcript text."
assistant_prefix = "<think>\n\n</think>\n\n"
description = "Dictation clean-up only, no screen context. ~1.5 GB VRAM."
